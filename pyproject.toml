[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-drift-sentinel"
version = "1.0.0"
description = "Automated Multi-Cloud Security Posture Management & Infrastructure Drift Detection Engine"
readme = "README.md"
authors = [{ name = "Aditya Singh", email = "adityasingh120444@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "boto3>=1.28.0",
    "botocore>=1.31.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
cloud-drift-sentinel = "cloud_drift_sentinel.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
